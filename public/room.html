<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void | Workspace</title>
    <style>
        :root { 
            --bg: #000000; 
            --surface: #0a0a0a; 
            --border: #222222; 
            --border-hover: #333333; 
            --text: #ffffff; 
            --text-dim: #777777; 
            --accent: #ffffff; 
            --error: #ff4444; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        
        /* --- Navigation --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 2rem 3rem; border-bottom: 1px solid var(--border); }
        .nav-brand { font-weight: 500; letter-spacing: 3px; font-size: 1rem; text-transform: uppercase; text-decoration: none; color: var(--text); }
        
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-item { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s ease; }
        .nav-item:hover { color: var(--text); }
        .disconnect-btn { color: var(--error); font-weight: 500; }
        .disconnect-btn:hover { color: #ff6666; }

        /* --- Layout & Workspace --- */
        .container { flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; display: flex; flex-direction: column; }
        
        .room-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem; }
        .room-meta { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; }
        .room-id { font-family: 'Courier New', Courier, monospace; font-size: 2.5rem; font-weight: 300; line-height: 1; }
        
        .tabs { display: flex; gap: 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .tab { color: var(--text-dim); cursor: pointer; padding-bottom: 1rem; border-bottom: 2px solid transparent; transition: all 0.3s ease; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }

        textarea { width: 100%; height: 500px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 2rem; border-radius: 12px; font-family: 'Courier New', Courier, monospace; resize: vertical; outline: none; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; transition: border-color 0.3s ease; }
        textarea:focus { border-color: var(--border-hover); }

        button { background: var(--accent); color: var(--bg); border: none; padding: 1rem 3rem; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: transform 0.2s ease, opacity 0.2s ease; }
        button:hover { opacity: 0.9; }

        .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1.5rem; overflow: hidden; }
        .history-meta { background: transparent; padding: 1rem 1.5rem; font-size: 0.8rem; color: var(--text-dim); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .history-code { padding: 2rem 1.5rem; overflow-x: auto; max-height: 500px; white-space: pre; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; line-height: 1.5; }
        .copy-btn { background: var(--border); color: var(--text); border: none; cursor: pointer; font-size: 0.75rem; padding: 0.4rem 1rem; border-radius: 4px; width: auto; font-weight: 500; text-transform: uppercase; transition: background 0.2s ease; }
        .copy-btn:hover { background: #444; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-brand">VOID.</a>
        <div class="nav-links">
            <a href="/" class="nav-item">Home</a>
            <a href="/about" class="nav-item">About</a>
            <a href="/" class="nav-item disconnect-btn">Disconnect</a>
        </div>
    </nav>

    <div class="container">
        <div class="room-header">
            <div>
                <div class="room-meta">Connected Workspace</div>
                <div class="room-id" id="displayId">Loading...</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('paste')">Editor</div>
            <div class="tab" onclick="switchTab('history')">Payload Log</div>
        </div>

        <div id="pasteTab">
            <textarea id="codeInput" placeholder="Paste your massive code chunks here..."></textarea>
            <div style="display: flex; justify-content: flex-end;">
                <button onclick="submitCode()">Push Payload</button>
            </div>
        </div>

        <div id="historyTab" style="display: none;">
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const roomId = window.location.pathname.split('/').pop();
        document.getElementById('displayId').innerText = roomId;

        window.onload = async () => {
            const res = await fetch('/api/join', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ roomId }) });
            const data = await res.json();
            if (!data.success) {
                alert("Room no longer exists.");
                window.location.href = "/";
            }
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'paste') {
                document.getElementById('pasteTab').style.display = 'block';
                document.getElementById('historyTab').style.display = 'none';
            } else {
                document.getElementById('pasteTab').style.display = 'none';
                document.getElementById('historyTab').style.display = 'block';
                loadHistory();
            }
        }

        async function submitCode() {
            const code = document.getElementById('codeInput').value;
            if (!code.trim()) return;

            await fetch('/api/paste', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ roomId, code }) });
            document.getElementById('codeInput').value = '';
            document.querySelectorAll('.tab')[1].click(); 
        }

        async function loadHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<p style="color: var(--text-dim); text-align:center; padding: 2rem;">Fetching payloads...</p>';
            
            const res = await fetch('/api/history/' + roomId);
            const history = await res.json();

            if (history.length === 0) {
                list.innerHTML = '<p style="color: var(--text-dim); text-align:center; padding: 2rem;">This workspace is currently empty.</p>';
                return;
            }

            list.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <div class="history-meta">
                        <span>${item.time}</span>
                        <button class="copy-btn" onclick="copyText(${index})">Copy</button>
                    </div>
                    <div class="history-code" id="code-${index}">${escapeHTML(item.code)}</div>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function copyText(index) {
            const text = document.getElementById('code-' + index).innerText;
            navigator.clipboard.writeText(text);
            event.target.innerText = "Copied!";
            setTimeout(() => event.target.innerText = "Copy", 2000);
        }
    </script>
</body>
</html>
